<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Browse the full Clothing. collection — women, men and accessories. Free shipping over EGP 1,000, easy 30-day returns." />
  <meta name="theme-color" content="#2b1f15" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Shop the Collection — Clothing." />
  <meta property="og:description" content="Browse 47 pieces across Women, Men, Kids, Sportswear and Accessories — filter by category, color and price." />
  <meta property="og:image" content="https://images.unsplash.com/photo-1445205170230-053b83016050?auto=format&fit=crop&w=1200&q=80" />
  <title>Shop — Clothing. | Timeless Fashion Collection</title>
  <link rel="icon" type="image/png" href="assets/img/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,500;1,600&family=Outfit:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body data-page="shop">
  <div id="siteTop"></div>

  <section class="page-head">
    <div class="container">
      <h1 class="page-head__title">Shop the Collection</h1>
      <nav class="crumbs" aria-label="Breadcrumb"><a href="index.html">Home</a> <span class="sep">/</span> <span aria-current="page">Shop</span></nav>
    </div>
  </section>

  <main class="shop">
    <div class="container shop__layout">
      <!-- SIDEBAR -->
      <aside class="shop__side">
        <div class="side-box">
          <label class="side-search">
            <span class="side-search__icon" aria-hidden="true">
              <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            </span>
            <input id="shopSearch" type="search" placeholder="Search products..." aria-label="Search products" />
          </label>
        </div>
        <div class="side-box">
          <h3 class="side-box__title">Categories</h3>
          <ul class="filter-list">
            <li><button data-filter-cat="All" class="filter-list__btn is-active">All</button></li>
            <li><button data-filter-cat="Women" class="filter-list__btn">Women</button></li>
            <li><button data-filter-cat="Men" class="filter-list__btn">Men</button></li>
            <li><button data-filter-cat="Kids" class="filter-list__btn">Kids</button></li>
            <li><button data-filter-cat="Sportswear" class="filter-list__btn">Sportswear</button></li>
            <li><button data-filter-cat="Accessories" class="filter-list__btn">Accessories</button></li>
          </ul>
        </div>
        <div class="side-box">
          <h3 class="side-box__title">Color</h3>
          <div class="swatches" id="shopSwatches"></div>
        </div>
        <div class="side-box">
          <h3 class="side-box__title">Price Range</h3>
          <p class="side-box__hint">Tap a range again to clear it.</p>
          <ul class="filter-list" id="shopPriceList"></ul>
        </div>
        <div class="side-promo" style="background-image:url('https://images.unsplash.com/photo-1487412720507-e7ab37603c6f?auto=format&fit=crop&w=500&q=80')">
          <div class="side-promo__body">
            <span>Hot Sale</span>
            <h4>Up To<br>50% OFF</h4>
            <a href="shop.html" class="link-arrow">Shop Now <span>→</span></a>
          </div>
        </div>
      </aside>

      <!-- GRID -->
      <div class="shop__main">
        <div class="shop__bar">
          <span class="shop__count" id="shopCount">Showing products</span>
          <label class="shop__sort">Sort by
            <select id="shopSort" aria-label="Sort products">
              <option value="default">Default sorting</option>
              <option value="newest">Newest First</option>
              <option value="low">Price: Low to High</option>
              <option value="high">Price: High to Low</option>
              <option value="rating">Top Rated</option>
            </select>
          </label>
        </div>
        <div class="products__grid shop__grid" id="shopGrid"></div>
        <nav class="pagination" id="shopPagination" aria-label="Pagination"></nav>
      </div>
    </div>
  </main>

  <div id="siteBottom"></div>
  <script src="script.js"></script>
</body>
</html>
